<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2847"/>
      <stop offset="1" stop-color="#0b1122"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="236" r="200" fill="url(#glow)"/>
  <!-- crystal (the office's Obsidian brain) -->
  <polygon points="256,72 152,232 256,392" fill="url(#left)"/>
  <polygon points="256,72 360,232 256,392" fill="url(#right)"/>
  <polygon points="256,72 152,232 256,252" fill="#ede9fe" opacity="0.35"/>
  <!-- N -->
  <path d="M206 300 V164 h22 l56 90 V164 h22 v136 h-22 l-56 -90 v90 z" fill="#0b1122" opacity="0.85"/>
  <!-- desk lamp line -->
  <rect x="146" y="420" width="220" height="14" rx="7" fill="url(#lamp)"/>
</svg>
